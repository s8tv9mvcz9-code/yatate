name: Android CI

# 矢立の Android 殻（M8）。**すべて ubuntu で回る**（課金 1 倍）。
#
# 関門は四つ:
#
#   ① 橋の試験          android/rust を host で cargo test（jni は android ターゲットのみ）
#   ② 実 .so のリンク    cargo-ndk で arm64-v8a / x86_64 を組む
#   ③ 出口表の検査       Java_jp_yatate_ime_Core_* が実在するか
#                       ＝「読み込まれるのに関数が無い」の防止
#   ④ APK が組めるか     gradle assembleDebug ＋ Kotlin の単体試験
#
# ③ は Windows 殻が実 DLL のエクスポート表を検べ、web 殻が wasm の import を
# 検べてゐるのと同じ役回りである。ここが無いと、端末に入れて初めて
# `UnsatisfiedLinkError` で気づくことになる。

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bridge:
    name: 橋（JNI）の試験と .so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust の支度
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: 試験（host — 橋の論理は OS に依らない）
        working-directory: android/rust
        run: cargo test --all-targets

      - name: clippy
        working-directory: android/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: fmt
        working-directory: android/rust
        run: cargo fmt --check

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: 実 .so を組む（arm64-v8a / x86_64）
        working-directory: android/rust
        run: |
          # ランナーが用意する NDK の場所は版によつて名が違ふ。
          # `${{ env.* }}` では拾へない（ジョブの env にしか無い）ので、
          # シェルの側で実在するものを選ぶ。
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          test -d "$ANDROID_NDK_HOME" || { echo "::error::NDK が見つからない"; exit 1; }
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release

      - name: 出口表に JNI の関数が実在するか
        run: |
          set -e
          so=android/app/src/main/jniLibs/arm64-v8a/libyatate_android.so
          test -f "$so" || { echo "::error::$so が無い"; exit 1; }
          echo "size: $(stat -c%s "$so") bytes"
          missing=0
          for f in nativeNew nativeFree nativeKey nativeKana nativeOp nativeChoose \
                   nativeReset nativePreedit nativeCommitted nativeCandidates \
                   nativeFocusRange nativeIsComposing nativeChosen nativeGojuon nativeLines; do
            sym="Java_jp_yatate_ime_Core_$f"
            if nm -D --defined-only "$so" | grep -q " $sym\$"; then
              echo "  [OK] $sym"
            else
              echo "::error::出口が無い: $sym"
              missing=1
            fi
          done
          exit $missing

      - name: .so を次の段へ渡す
        uses: actions/upload-artifact@v4
        with:
          name: yatate-jnilibs
          path: android/app/src/main/jniLibs
          retention-days: 7

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4

      - name: .so を受け取る
        uses: actions/download-artifact@v4
        with:
          name: yatate-jnilibs
          path: android/app/src/main/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle の支度（wrapper は置かない — jar を配らないため）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Kotlin の単体試験
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: APK を組む
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: 出来た APK に .so が入つてゐるか
        working-directory: android
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk" || { echo "::error::APK が無い"; exit 1; }
          echo "APK: $(stat -c%s "$apk") bytes"
          for abi in arm64-v8a x86_64; do
            if unzip -l "$apk" | grep -q "lib/$abi/libyatate_android.so"; then
              echo "  [OK] lib/$abi/libyatate_android.so"
            else
              echo "::error::APK に $abi の .so が入つてゐない"
              exit 1
            fi
          done

      - name: 配布物
        uses: actions/upload-artifact@v4
        with:
          name: yatate-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
