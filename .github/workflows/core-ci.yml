name: Core CI
# 決定的核（core/・Rust）の検証と、SSOT からの生成物の鮮度ゲート。
#
# **ubuntu で回す**（課金 1 倍）。核の正しさは OS に依らないので、macOS ランナー
# （10 倍）を使ふ理由が無い。macOS が要るのは「殻がビルドできるか」だけで、
# それは ios-ci.yml の仕事である（docs/ime/cross-platform.md §7）。
#
# ⚠ paths を core/** だけに狭めないこと。鮮度ゲートは
# 「ssot/kyuji.py を変へたのに core/src/generated/ が古いまま」を捕まへる関門で、
# 引き金に SSOT 側と生成スクリプトを含めないとゲートが素通りになる
# （ios-ci.yml が同じ注意書きを持つてゐる）。
on:
  push:
    paths:
      - "core/**"
      - "windows/**"
      - "ssot/**"
      - "scripts/gen_rust_tables.py"
      - "scripts/gen_bigram_tables.py"
      - "scripts/gen_parity_vectors.py"
      - ".github/workflows/core-ci.yml"
  pull_request:
    paths:
      - "core/**"
      - "windows/**"
      - "ssot/**"
      - "scripts/gen_rust_tables.py"
      - "scripts/gen_bigram_tables.py"
      - "scripts/gen_parity_vectors.py"
      - ".github/workflows/core-ci.yml"
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python SSOT のテスト（依存ゼロ）
        run: python3 ssot/test_kyuji.py

      # --component は 1 つずつ渡す。`--component rustfmt clippy` と書くと
      # clippy がツールチェーン名として解釈され `invalid toolchain name` で落ちる。
      - name: Rust ツールチェーン
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable

      - name: cargo test（単体 ＋ 黄金ベクトル）
        working-directory: core
        run: cargo test --all-targets

      - name: cargo clippy（警告をエラーにする）
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt の検査
        working-directory: core
        run: cargo fmt --check

      # 生成物の鮮度ゲート — 再生成して差分が出たら「元を変へたのに写しが古い」といふこと。
      #
      #   表（Python が SSOT）   : ssot/kyuji.py           → core/src/generated/kyuji_table.rs
      #   表（データが SSOT）    : core/data/kana_bigram.txt → Swift と Rust の bigram 表
      #   ベクトル（Python）     : ssot/kyuji.py           → core/vectors/kyuji.json
      #   ベクトル（核がSSOT）   : core/src/*.rs           → core/vectors/{gojuon,kehai}.json
      #
      # bigram の収穫（gen_yatate_ngram.py）は青空文庫へ通信するので CI では回さない。
      # 表を起こす側（gen_bigram_tables.py）は通信しないのでここで回せる。
      - name: 生成物の鮮度（表・黄金ベクトル）
        run: |
          python3 scripts/gen_rust_tables.py
          python3 scripts/gen_bigram_tables.py
          python3 scripts/gen_parity_vectors.py
          cargo run --quiet --manifest-path core/Cargo.toml --bin gen-vectors
          git diff --exit-code -- \
            core/src/generated core/vectors core/data \
            ios/YatateCore/Sources/YatateCore/Generated

  # Windows の殻（TSF）— **ubuntu で検査する**（課金 1 倍）。
  # 頭脳（session）は OS を知らないので host で試験でき、COM 側は
  # `--target x86_64-pc-windows-gnu` の型検査で「壊れてゐない」ことまで見る。
  # 実機での動作確認は Windows 機でしか出来ないが、それはこのゲートの役目ではない。
  windows-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust ツールチェーン（Windows ターゲットつき）
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: cargo test（OS 非依存の頭脳 session・registration）
        working-directory: windows
        run: cargo test --all-targets

      - name: cargo clippy / fmt
        working-directory: windows
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo fmt --check

      # COM の入口が型として成立してゐるか。Windows 機が無くてもここまでは守れる。
      - name: cargo check（x86_64-pc-windows-gnu）
        working-directory: windows
        run: cargo check --target x86_64-pc-windows-gnu
