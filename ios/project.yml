name: Yatate
options:
  bundleIdPrefix: com.bungo
  deploymentTarget: { iOS: "16.0" }
settings:
  base: { MARKETING_VERSION: "1.0", CURRENT_PROJECT_VERSION: "1", GENERATE_INFOPLIST_FILE: NO }
packages:
  YatateCore:
    path: YatateCore
targets:
  Yatate:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Store Connect のアプリレコード（SKU: BungoRag_Yatate）に合はせる。
        # バンドル ID は利用者に見えない。見えるのは CFBundleDisplayName＝矢立。
        PRODUCT_BUNDLE_IDENTIFIER: com.bungo.BungoRag
    dependencies:
      - target: YatateKeyboard   # 拡張を .app に同梱（app-extension は既定で embed）
      - package: YatateCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 矢立
        # GENERATE_INFOPLIST_FILE=NO ゆゑ Xcode が自動付与しない。
        # 無いと App Store が ITMS-90713 で弾く。
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        # 未宣言だと App Store が弾く（Invalid bundle. No orientations were specified）。
        # 文机は横でも使へるので四方向すべて許す。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  # 矢立 — 文語 IME キーボード拡張。通信せず、フルアクセスも要求しない。
  YatateKeyboard:
    type: app-extension
    platform: iOS
    sources: [YatateKeyboard]
    dependencies:
      - package: YatateCore
    settings:
      base:
        # 拡張の ID は本体 ID を接頭辞に持つ必要がある
        PRODUCT_BUNDLE_IDENTIFIER: com.bungo.BungoRag.YatateKeyboard
    info:
      path: YatateKeyboard/Info.plist
      properties:
        CFBundleDisplayName: 矢立
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja-JP
            # 通信しないので不要。許可の有無で挙動は変はらない。
            RequestsOpenAccess: false
  # 矢立 macOS — 文机の macOS 版（docs/ime/fuzukue.md §4 の先行像）。
  # **FuzukueView と YatateCore は iOS 版と同一のソースを共有する**。
  # macOS 固有なのは ../macos/YatateMacApp.swift だけ。
  YatateMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      # ⚠ ../macos は再帰的に拾はれる。YatateIME/ を除かないと、入力方式の
      # main.swift（トップレベルのコード）と YatateMacApp.swift（@main）が
      # 同じターゲットに同居して**コンパイルが通らない**——実際にさうなつてゐた。
      - path: ../macos
        excludes:
          - "YatateIME/**"
      - path: Sources/View/FuzukueView.swift   # iOS 版と同じ実体を共有
    dependencies:
      - package: YatateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bungo.Yatate.Mac
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: ../macos/Info.plist
      properties:
        CFBundleDisplayName: 矢立
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "MIT License"
  # 矢立 macOS IME — IMKit のテキストサービス（M6・原器が帰る場所）。
  #
  # 入力方式は「常駐する小さな .app」で、~/Library/Input Methods/ に置く。
  # Info.plist は IMKit の契約（接続名・制御子・入力ソースの名乗り）を持つてゐて
  # 生成物ではないので、info: では作らず INFOPLIST_FILE で在るものを指す。
  YatateIME:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: ../macos/YatateIME/main.swift
      - path: ../macos/YatateIME/YatateInputController.swift
      - path: ../macos/YatateIME/CandidateWindow.swift
    dependencies:
      - package: YatateCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.yatate.inputmethod
        INFOPLIST_FILE: ../macos/YatateIME/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
        # 入力方式は他アプリのプロセスと同居しないが、配るには署名と公証が要る。
        # 手元の検証は未署名（CODE_SIGNING_ALLOWED=NO）で通る。
        SKIP_INSTALL: NO
